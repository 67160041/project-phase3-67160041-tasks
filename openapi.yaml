openapi: 3.0.3
info:
  title: Tasks Management Microservice API
  description: >
    API สำหรับระบบจัดการงาน (Tasks Management) ที่เชื่อมต่อกับฐานข้อมูล MySQL 
    และประมวลผลงานแบบเบื้องหลังด้วย Redis Task Queue (BullMQ)
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Development Server

paths:
  /tasks:
    get:
      summary: ดึงรายการงานทั้งหมด (Route 1)
      responses:
        "200":
          description: ดึงข้อมูลสำเร็จ

    post:
      summary: มอบหมายงานใหม่ (Route 4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskInput"
      responses:
        "201":
          description: บันทึกงานสำเร็จ

  /tasks/stats/overview:
    get:
      summary: ดึงสถิติภาพรวมระบบ (Route 2)
      responses:
        "200":
          description: ดึงสถิติสำเร็จ

  /tasks/{id}:
    get:
      summary: ดึงข้อมูลงานตาม ID (Route 3)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ดึงข้อมูลสำเร็จ

    put:
      summary: อัปเดตสถานะงาน (Route 5)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: Done
      responses:
        "200":
          description: แก้ไขข้อมูลสำเร็จ

    delete:
      summary: ลบรายการงาน (Route 6)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ลบข้อมูลสำเร็จ

components:
  schemas:
    CreateTaskInput:
      type: object
      required:
        - title
        - dueDate
        - status
        - user_id
        - category_id
      properties:
        title:
          type: string
          example: ส่งงานโปรเจกต์ระยะที่ 2
        dueDate:
          type: string
          format: date
          example: "2026-10-31"
        status:
          type: string
          example: Pending
        user_id:
          oneOf:
            - type: integer
              example: 4
            - type: string
              example: ภูชิต ฤทธิไกร
        category_id:
          oneOf:
            - type: integer
              example: 1
            - type: string
              example: Project
